<div class="main">
    <app-alerts></app-alerts>
    <div class="centered-container">
        <div class="container user">
            <!-- Tabs Navigation -->
            <div style="display: flex; justify-content: space-between;">
                <button class="fw-semibold" (click)="openDeleteModal()"
                    style="background-color: #800020;font-weight: 500;color: white; padding: 10px 20px; border-radius: 5px; font-size: 14px; border: none;">
                    Delete Selected
                </button>
                <!-- Search Bar with Filter -->
                <div class="d-flex align-items-center w-25"
                    style="border-radius: 10px; box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);">
                    <span class="px-2">
                        <i class="fas fa-search" style="color: gray; font-size: 18px;"></i>
                    </span>
                    <input type="text" placeholder="Search" class="form-control border-0 bg-white"
                        style="box-shadow: none; color: #8F9899">
                    <div class="px-3 py-2" (click)="toggleFilterDropdown()"
                        style="background-color: #D8D8D8;  border-top-right-radius: 10px; border-bottom-right-radius: 10px; cursor: pointer">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="black" class="bi bi-funnel"
                            viewBox="0 0 16 16">
                            <path
                                d="M1.5 1.5a.5.5 0 0 1 .5-.5h12a.5.5 0 0 1 .4.8L10 8.118V13.5a.5.5 0 0 1-.757.429l-2-1.2A.5.5 0 0 1 7 12.3V8.118L1.1 1.8a.5.5 0 0 1 .4-.8z" />
                        </svg>
                    </div>
                    <!-- Dropdown Popup -->
                    <div *ngIf="showFilterDropdown" class="position-absolute mt-2 shadow-sm"
                        style="background: white; padding: 12px 16px; border-radius: 10px; z-index: 1000; min-width: 10%; right: 4%; top: 26%">

                        <!-- Triangle Arrow -->
                        <div
                            style="position: absolute; top: -10px; right: 12px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 10px solid white;">
                        </div>

                        <!-- Date -->
                        <div class="d-flex align-items-center mb-2" style="cursor: pointer;">
                            <i class="fas fa-briefcase me-2" style="font-size: 14px;"></i>
                            <span style="font-weight: 500; font-size: 14px;">Date</span>
                        </div>

                        <!-- Room No -->
                        <div class="d-flex align-items-center" style="cursor: pointer;">
                            <i class="fas fa-hotel me-2" style="font-size: 14px;"></i>
                            <span style="font-weight: 500; font-size: 14px;">Room No</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Guest Table -->
            <table class="table" style="margin-top: 3%;">
                <thead>
                    <tr>
                        <th style="text-align: center;">
                            <input type="checkbox">
                        </th>
                        <th>Guest Name</th>
                        <th>Room No</th>
                        <th>No.Of Guests</th>
                        <th>Check-in</th>
                        <th>Check-out</th>
                        <th>Room Occupancy</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let guest of guests" style="background-color: white;">
                        <td>
                            <input type="checkbox" [id]="guest.name" [name]="guest.name" [value]="guest.name"
                                (change)="toggleSelection($event, guest.id)">
                        </td>
                        <td>{{ guest.name }}</td>
                        <td>{{ guest.roomNo }}</td>
                        <td>{{ guest.noOfGuests }}</td>
                        <td>{{ guest.checkIn }}</td>
                        <td>{{ guest.checkOut }}</td>
                        <td [ngStyle]="{ color: guest.roomOccupancy === 'Stayed' ? '#FF6E27' : '#009F13' }">{{
                            guest.roomOccupancy }}</td>
                        <td class="position-relative">
                            <i class="fa fa-ellipsis-h" style="color: #868686; cursor: pointer;"
                                (click)="toggleDropdown(guest.id)"></i>

                            <!-- Dropdown -->
                            <div *ngIf="dropdownVisibleId === guest.id" class="position-absolute mt-2 shadow-sm"
                                style="background: white; padding: 5px 15px; border-radius: 10px; z-index: 1000; min-width: 10%; top: 60%;">
                                <!-- Triangle Arrow -->
                                <div
                                    style="position: absolute; top: -10px; right: 12px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 10px solid white;">
                                </div>

                                <!-- View Option -->
                                <div class="d-flex align-items-center" style="cursor: pointer;" (click)="viewGuest(guest.id)">
                                    <i class="fa fa-eye me-2" style="font-size: 10px;"></i>
                                    <span style="font-weight: 500; font-size: 11px;">View</span>
                                </div>

                                <!-- Date Option -->
                                <div class="d-flex align-items-center mb-2 mt-1"
                                    style="cursor: pointer; margin-bottom: 0 !important;">
                                    <i class="fas fa-print me-2" style="font-size: 10px;"></i>
                                    <span style="font-weight: 500; font-size: 11px;">Print</span>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>

<!-- Confirmation Modal for Deleting -->
<div *ngIf="isDeleteModalOpen"
    style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center;">

    <div
        style="background: white; padding: 30px; border-radius: 15px; width: 450px; text-align: center; box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);">

        <!-- Confirmation Text -->
        <h2 style="margin-bottom: 10px; font-size: 20px; font-weight: bold;">Are you sure you want to delete?</h2>

        <!-- Warning Text (optional) -->
        <p style="font-size: 16px; margin-bottom: 20px;">This action cannot be undone.</p>

        <!-- Buttons: Cancel and Confirm -->
        <div style="display: flex; justify-content: space-around;">
            <button
                style="padding: 12px; background: #E1E2EB; color: black; border: none; cursor: pointer; width: 45%; border-radius: 8px;"
                (click)="closeDeleteModal()">
                Cancel
            </button>
            <button
                style="padding: 12px; background: #800020; color: white; border: none; cursor: pointer; width: 45%; border-radius: 8px;"
                (click)="deleteSelectedGuests()">
                Delete
            </button>
        </div>

    </div>
</div>
