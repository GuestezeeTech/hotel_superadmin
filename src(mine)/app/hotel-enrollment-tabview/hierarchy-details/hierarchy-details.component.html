<!-- <app-alerts></app-alerts> -->
<div class="section">
  <!-- <div class="row row-cols-1 row-cols-md-3 g-5 mb-5"> -->
  <div class="row row-cols-1 row-cols-md-3 g-5 mb-5" *ngIf="hierarchies.length > 0; else noDept">
    <!-- <div *ngIf="hierarchies.length > 0; else noDept"> -->
    <div class="col" *ngFor="let hierarchy of hierarchies">
      <div class="card h-100 text-center"
        style="border: 1px solid #EAEAEF; background: linear-gradient(90deg, #f931791a -2.75%, #c100e01a 99.79%);">
        <div class="card-header fw-bold" id=`{{hierarchy.name}}`>{{ hierarchy.name ||
          hierarchy.customer_hierarchy?.name
          || 'Hierarchy'}}</div>
        <div class="card-body text-start">
          <!-- <button class="isViewBtn button w-100 py-1 my-1 fw-bold" (click)="onViewHierarchy(hierarchy.customer_id)"> -->
          <button class="isViewBtn button w-100 py-1 my-1 fw-bold"
            (click)="onViewHierarchy(hierarchy.customer_member_id)">
            <!--newly changed from customer_id to customer_member_id-->
            View Hierarchy
          </button>
        </div>
      </div>

      <!-- Condition for choose button -->

    </div>
  </div>

  <!-- </div> -->
  <ng-template #noDept>
    <div *ngIf="hierarchies.length === 0" class="col d-flex justify-content-center align-items-center">
      <p class="no-dept">No Hierarchy added yet.</p>
    </div>
  </ng-template>
</div>
<!-- Newly added -->
<div style="display: flex;justify-content: flex-end;">
  <button type="submit" class="save_bt mr-3" (click)="previousTab()">Previous Tab</button>
  <button type="submit" class="save_bt" (click)="nextTab()">Next Tab</button>
</div>
