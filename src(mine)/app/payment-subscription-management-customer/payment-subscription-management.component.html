<div >
  <div class="centered-container">
    <div class="container mt-1">

      <!-- Back Button -->
      <!-- <p class="fw-medium" style="font-size: 18px; color: #1A1A1A; cursor: pointer;" (click)="goBack()">
        <i class="fas fa-angle-left" style="font-size: 13px"></i> Back
      </p> -->

      <!-- Pricing Plans -->
      <div class="row row-cols-1 row-cols-md-4 g-3 mb-5">
        <div class="col" *ngFor="let plan of plans; let i = index">
          <div class="card h-100 text-center" [ngClass]="plan.isCurrent ? 'isCurrent' : 'isNotCurrent'">

            <!-- Header -->
            <div class="card-header fw-bold" style="font-size: 17px">
              <i class="fas fa-crown" *ngIf="plan.isCurrent"></i>&nbsp;{{ plan.name }}
            </div>

            <!-- Body -->
            <div class="card-body text-center">

              <!-- Base Price -->
              <h4 class="fw-bold">
                ₹{{ plan.finalPrice | number:'1.2-2' }}
                <small>/Year</small>
              </h4>

              <!-- Per Room Cost Input -->
              <div class="mt-2">
                <label class="fw-semibold" style="font-size: 13px;">Per Room Cost:</label>
                <input type="number"
                       class="form-control text-center"
                       [(ngModel)]="plan.perRoomCost"
                       (input)="calculateDiscount(plan)"
                       min="0"
                       placeholder="Enter cost per room" />
              </div>

              <!-- Discount Type Select -->
              <div class="mt-3">
                <label class="fw-semibold" style="font-size: 13px;">Discount Type:</label>
                <select class="form-select text-center"
                        [(ngModel)]="plan.discountType"
                        (change)="calculateDiscount(plan)">
                  <option value="percentage">Percentage</option>
                  <option value="flat">Flat Price</option>
                  <option value="selected" selected>select</option>
                </select>
              </div>

              <!-- Discount Value Input -->
              <div class="mt-3">
                <label class="fw-semibold" style="font-size: 13px;">Discount Value</label>
                <input type="number"
                       class="form-control text-center"
                       [(ngModel)]="plan.discountValue"
                       (input)="calculateDiscount(plan)"
                       min="0"
                       [placeholder]="plan.discountType === 'percentage' ? '0 %' : '0'" />
              </div>

              <!-- GST (readonly) -->
              <div class="mt-3 fw-bold">
                GST (18%): ₹{{ plan.gstAmount | number:'1.2-2'}}
              </div>

              <!-- Final Price -->
              <div class="mt-3 fw-bold">
                Final Price: ₹{{ plan.finalPrice | number:'1.2-2' }}
              </div>

              <!-- Save Button -->
              <button class="btn w-100 py-2 my-2 fw-bold"
                      [ngClass]="plan.isCurrent ? 'isBtnCurrent' : 'isBtnNotCurrent'"
                      (click)="calculateDiscount1(plan)">
              <i class="fas fa-crown" *ngIf="plan.isCurrent"></i>&nbsp;   SAVE
              </button>

            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<div style="display: flex;justify-content: flex-end;">
  <button type="submit" class="save_bt mr-3" (click)="previousTab()">Previous Tab</button>
  <!-- <button type="submit" class="save_bt" (click)="nextTab()">Next Tab</button> -->
</div>
