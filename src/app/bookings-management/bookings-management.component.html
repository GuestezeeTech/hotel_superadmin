<div class="main">
    <app-alerts></app-alerts>
    <div class="centered-container">
        <div class="container">
            <!-- Back Button Section -->
            <div class="d-flex align-items-center mb-3" *ngIf="currentStatus">
                <!-- <button class="btn btn-sm btn-outline-secondary me-2" (click)="goBack()"
                    style="display: flex; align-items: center; gap: 5px;">
                    <i class="fas fa-arrow-left"></i>
                    Back to Dashboard
                </button> -->
                <h6 class="fw-bolder d-flex align-items-center mb-0">
                    <i class="fas fa-arrow-left me-2" style="cursor: pointer;" (click)="goBack()"></i>
                    {{ getStatusTitle() }}
                </h6>
            </div>
            <!-- Table -->
            <div class="table-responsive">
                <div style="border: 1px solid #dee2e6; border-radius: 12px; overflow: hidden;">
                    <table class="table text-center align-middle mb-0">
                        <thead class="table-light">
                            <tr class="text-nowrap">
                                <th class="text-start">Hotel Name</th>
                                <th>Member Id</th>
                                <th>Brand Name</th>
                                <th>Expiry Date</th>
                            </tr>
                        </thead>
                        <tbody *ngIf="customerlist?.length > 0; else noMembers">
                            <tr *ngFor="let log of customerlist">
                                <td class="text-start">{{ log.name }}</td>
                                <td>{{ log.member_id }}</td>
                                <td>{{ log.brand || '-' }}</td>
                                <td>{{ log.expired_date || '-' }}</td>
                            </tr>
                        </tbody>
                        <ng-template #noMembers>
                            <tbody>
                                <tr>
                                    <td colspan="4" class="text-center py-4 text-muted">
                                        No members available
                                    </td>
                                </tr>
                            </tbody>
                        </ng-template>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
