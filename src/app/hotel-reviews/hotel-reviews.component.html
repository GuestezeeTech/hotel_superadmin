<div class="main">
    <div class="centered-container">
        <div class="container">
            <div class="row mb-4">
                <div class="d-flex justify-content-between align-items-center ">
                    <h6 class="fw-bolder">Hotel Reviews</h6>
                    <div style="position: relative; display: inline-block;">
                        <div>
                            <!-- Filter Icon -->
                            <i class="fas fa-filter filter-icon" alt="Filter" (click)="toggleDropdown()"
                                style="width: 30px; height: 30px; cursor: pointer; margin-left:90%; color: white; -webkit-text-stroke: 1px black;"></i>
                        </div>

                        <!-- Dropdown -->
                        <div *ngIf="isDropdownOpen"
                            style="position: absolute; top: 70%; right: -40%; background: white; border-radius: 8px; 
                               box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1); padding: 10px; min-width: 100px; z-index: 100;">
                            <div style="display: flex; align-items: center; padding: 5px; cursor: pointer;"
                                (click)="selectFilter('Date')">
                                <img src="../../assets/images/guestezee/date.png" alt="Date"
                                    style="width: 15px; object-fit: cover; height: 15px; object-fit: cover; margin-right: 8px;">
                                <span>Date</span>
                            </div>
                            <div style="display: flex; align-items: center; padding: 5px; cursor: pointer;"
                                (click)="selectFilter('Reviews')">
                                <img src="../../assets/images/guestezee/reviews.png" alt="Reviews"
                                    style="width: 15px; object-fit: cover; height: 15px; object-fit: cover; margin-right: 8px;">
                                <span>Reviews</span>
                            </div>
                        </div>
                    </div>
                </div>
                <table class="table hotel-reviews">
                    <thead>
                        <tr>
                            <th>Hotel Name</th>
                            <th>Date</th>
                            <th style="text-align: center">Rating Average</th>
                            <th>Reviews</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let review of hotelReviews">
                            <td (click)="navigateToDetails()" style="cursor: pointer">{{ review.name }}</td>
                            <td>{{ review.date }}</td>
                            <td style="text-align: center">{{ review.rating }}</td>
                            <td class="gold">{{ review.reviews }}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
