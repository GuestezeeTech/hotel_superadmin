<header class="header">
  <div class="menu-name">
    <h1>
      <img src="../../../assets/images/guestezee/menu.png" alt="Menu Icon" />
      <span>{{ activeMenu }}</span>
    </h1>
  </div>

  <div class="user-info" #userInfo>
    <button
      type="button"
      class="account-toggle"
      (click)="toggleLogout($event)"
      [attr.aria-expanded]="showAccount"
      aria-haspopup="menu"
      aria-label="Account menu"
    >
      <img
        class="profile-icon"
        [src]="profile_image || 'https://guestezee.s3.ap-south-2.amazonaws.com/GuestEzee/Brand/ChatGPT_Image_Jun_19__2026__01_25_37_PM.webp'"
        alt=""
      />
      <span class="username">{{ profile_name }}</span>
      <i class="bi bi-chevron-down account-chevron" aria-hidden="true"></i>
    </button>

    <div *ngIf="showAccount" class="profile-settings" role="menu">
      <button type="button" class="profile-menu-item" role="menuitem" (click)="navigateToProfile()">
        <i class="fas fa-user-circle" aria-hidden="true"></i>
        <span>Profile</span>
      </button>
      <button type="button" class="profile-menu-item" role="menuitem" (click)="logout()">
        <i class="fas fa-power-off" aria-hidden="true"></i>
        <span>Logout</span>
      </button>
    </div>
  </div>
</header>
<app-notification *ngIf="showNotification" (close)="toggleNotification()"></app-notification>
