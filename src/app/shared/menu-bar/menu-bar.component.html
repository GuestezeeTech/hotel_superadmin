<div class="sidenav">

  <div class="logo-container">
    <img src="../../assets/images/guestezee/logo.png" alt="Guestezee Logo" class="sidebar-logo" />
  </div>

  <hr class="center-hr" />
  <ul class="sidenav-menu">
    <li class="list_container" [class.active]="isDashboardActive()" routerLink="/dashboard"
      (click)="sendValue('Dashboard')" *ngIf="userAccess?.DASHBOARD?.has_read_permission==true"
      title="Dashboard">
      <i class="bi bi-speedometer2 menu-icon" aria-hidden="true"></i>
      <span>Dashboard</span>
    </li>

    <li class="list_container" [class.active]="isPlatformOverviewActive()" routerLink="/platform-overview"
      (click)="sendValue('Platform Overview')" *ngIf="userAccess?.DASHBOARD?.has_read_permission==true"
      title="Platform Overview">
      <i class="bi bi-building menu-icon" aria-hidden="true"></i>
      <span>Platform Overview</span>
    </li>

    <li class="list_container" [class.active]="isHotelsOverviewMenuActive()"
      *ngIf="userAccess?.DASHBOARD?.has_read_permission==true"
      (click)="toggleHotelsOverviewSubmenu($event)" title="Hotels Overview">
      <div class="list-content">
        <div class="left-content">
          <i class="bi bi-clipboard-data menu-icon" aria-hidden="true"></i>
          <span>Hotels Overview</span>
        </div>
        <i class="fas fa-chevron-down dropdown-icon" [ngClass]="{ 'rotate': isHotelsOverviewSubmenuOpen }"></i>
      </div>
    </li>

    <li class="sub-menu" *ngIf="isHotelsOverviewSubmenuOpen && userAccess?.DASHBOARD?.has_read_permission==true">
      <div class="submenu">
        <a class="submenu-item" [class.active]="isHotelOverviewActive()" routerLink="/overview-dashboard"
          (click)="selectHotelsOverviewLeaf('Hotel Overview', $event)">Hotel Overview</a>
        <a class="submenu-item" [class.active]="isFbDashboardActive()" routerLink="/fb/dashboard"
          (click)="selectHotelsOverviewLeaf('F&B Dashboard', $event)">F&amp;B Dashboard</a>
        <a class="submenu-item" [class.active]="isFoDashboardActive()" routerLink="/fo/dashboard"
          (click)="selectHotelsOverviewLeaf('Front Office Dashboard', $event)">Front Office (FD)</a>
        <a class="submenu-item" [class.active]="isHkDashboardActive()" routerLink="/hk/dashboard"
          (click)="selectHotelsOverviewLeaf('Housekeeping Dashboard', $event)">Housekeeping (HK)</a>
      </div>
    </li>

    <li class="list_container" [class.active]="isHotelActive()" routerLink="/hotel-list"
      (click)="sendValue('Hotels')" *ngIf="userAccess?.CUSTOMERS?.has_read_permission==true"
      title="Hotels">
      <i class="bi bi-buildings menu-icon" aria-hidden="true"></i>
      <span>Hotels</span>
    </li>

    <li class="list_container" [class.active]="isPaymentActive()" routerLink="/payment-tab-view"
      (click)="sendValue('Payment')" *ngIf="userAccess?.PAYMENT?.has_read_permission==true"
      title="Payment">
      <i class="bi bi-credit-card menu-icon" aria-hidden="true"></i>
      <span>Payment</span>
    </li>

    <li class="list_container" [class.active]="isSystemSettingsMenuActive()"
      *ngIf="userAccess?.SYSTEMSETTINGS?.has_read_permission==true"
      (click)="toggleSettingsSubmenu($event)" title="System Settings">
      <div class="list-content">
        <div class="left-content">
          <i class="bi bi-gear menu-icon" aria-hidden="true"></i>
          <span>System Settings</span>
        </div>
        <i class="fas fa-chevron-down dropdown-icon" [ngClass]="{ 'rotate': isSettingsSubmenuOpen }"></i>
      </div>
    </li>

    <li class="sub-menu" *ngIf="isSettingsSubmenuOpen && userAccess?.SYSTEMSETTINGS?.has_read_permission==true">
      <div class="submenu">
        <a class="submenu-item" [class.active]="istechnicalSettingsActive()" routerLink="/tech-info-list"
          (click)="selectSettingsLeaf('Technical Info', $event)">Technical Info</a>
        <a class="submenu-item" [class.active]="issubscriptionSettingsActive()" routerLink="/payment-subscription"
          (click)="selectSettingsLeaf('Payment Subscription', $event)">Payment Settings</a>
        <a class="submenu-item" [class.active]="ispaymentActivationActive()" routerLink="/payment-activation"
          (click)="selectSettingsLeaf('Payment Activation', $event)">Payment Activation</a>
      </div>
    </li>

    <li class="list_container" [class.active]="isEmailTemplateActive()" (click)="goToEmailTemplate()"
      title="Email Template">
      <i class="bi bi-envelope-paper menu-icon" aria-hidden="true"></i>
      <span>Email Template</span>
    </li>
  </ul>

</div>
