<app-alerts></app-alerts>
<div *ngIf="isLoading" class="technical-info-loader d-flex justify-content-center align-items-center"
    style="min-height: 300px; width: 100%;">
    <div class="text-center">
        <div class="spinner-border" role="status" style="color: #800020; width: 3rem; height: 3rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 text-muted" style="font-family: 'Urbanist', sans-serif;">Loading integrations...</p>
    </div>
</div>

<ng-container *ngIf="!isLoading">
    <div class="container" *ngIf="ecomData && ecomData.length > 0; else noData">
        <div class="card" *ngFor="let data of ecomData">
            <div style="display: flex;" (click)="viewDetails(data.id)">
                <div>
                    <!-- <i class="fas fa-lock icon" style="color: #ffcc00;"></i> -->
                    <!-- <img src="../../../assets/images/guestezee/lock.png"> -->
                    <img [src]="data.logo ? data.logo : '../../../assets/images/guestezee/lock.png'"
                        style="width: 60px; height: 60px; object-fit: contain; border-radius: 4px; padding: 2px; background-color: #f0f1f3;">
                    <i class="fas fa-cog settings outlined-icon" style="font-size: 18px;    font-weight: 600;"></i>
                </div>
            </div>
            <div style="display: flex;justify-content: space-between;margin-top: 5%;">
                <h5>{{data.name}}</h5>
                <label class="switch">
                    <input type="checkbox" [checked]="data.is_active === true" (change)="onToggleActive($event, data)">
                    <span class="slider round"></span>
                </label>
            </div>
        </div>
        <!-- <div class="card">
            <h5>Square</h5>
            <i class="fas fa-cog settings"></i>
            <div class="toggle-switch" onclick="toggleSwitch(this)"></div>
        </div> -->
    </div>
    <ng-template #noData>
        <div class="no-data-message text-center p-5 mt-4" style="background: white; border-radius: 10px; box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.05); width: 100%;">
            <p class="text-muted mb-0" style="font-family: 'Urbanist', sans-serif; font-size: 16px; font-weight: 500;">
                No integrations found for this category.
            </p>
        </div>
    </ng-template>
</ng-container>
